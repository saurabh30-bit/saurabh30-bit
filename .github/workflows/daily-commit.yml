name: Daily Auto Commit
on:
  schedule:
    - cron: '0 12 * * *' # Runs every day at 12:00 UTC
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Make random commits and push
        run: |
          git config user.name "saurabh30-bit"
          git config user.email "sshinde0582@gmail.com"
          
          RANDOM_EXTRA=$(( RANDOM % 10 ))
          TOTAL_COMMITS=$(( 20 + RANDOM_EXTRA ))
          
          for i in $(seq 1 $TOTAL_COMMITS); do
            echo "# Daily auto commit number $i at $(date)" >> src/main.py
            git add src/main.py
            git commit -m "Auto daily commit $i"
          done
          
          git push
